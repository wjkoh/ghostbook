name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify flake.nix version matches tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="${TAG#v}"
          actual="$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]+)";/\1/p' flake.nix | head -n 1)"
          if [ "$actual" != "$expected" ]; then
            echo "ERROR: flake.nix version ($actual) does not match release tag $TAG (expected $expected)" >&2
            exit 1
          fi
          echo "flake.nix version matches $TAG ($actual)"

      - name: Vet and test
        run: |
          go vet ./...
          go test -race -skip TestBrowserEndToEnd ./...

      - name: Cross-compile release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in "linux amd64" "linux arm64" "darwin arm64"; do
            set -- $target
            GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "dist/ghostbook-${1}-${2}" \
              ./cmd/ghostbook
          done
          (cd dist && sha256sum ghostbook-* > SHA256SUMS)
          ls -la dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --title "Ghostbook $TAG" \
            --generate-notes
