name: Close External Pull Requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close-external-pr:
    if: github.actor != github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Close external pull request
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Thank you for your interest in Ghostbook. This repository is published as a read-only open-source release under the Apache 2.0 license and does not accept external pull requests. Please feel free to fork the repository for your own modifications."
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: "closed"
            });
